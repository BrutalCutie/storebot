<!-- Кнопка для запуска модального окна -->
<button type="button" class="btn" data-bs-toggle="modal" data-bs-target="#staticBackdrop" onclick="fillCartContent()">
    🛒Корзина
</button>

<!-- Модальное окно -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">Ваша корзина</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body" id="cart-modal-content">


            
            </div>


        </div>
    </div>
</div>
